service: raj_real_henry_realestate

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: eu-north-1
  stage: ${opt:stage, 'prod'}
  memorySize: 1024
  timeout: 30
  environment:
    SECRET_KEY: ${env:SECRET_KEY}
    DEBUG: ${env:DEBUG}
    DATABASE_URL: ${env:DATABASE_URL}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY}
    AWS_STORAGE_BUCKET_NAME: ${env:AWS_STORAGE_BUCKET_NAME}
    AWS_S3_REGION_NAME: ${env:AWS_S3_REGION_NAME}
    S3_MEDIA_LOCATION: ${env:S3_MEDIA_LOCATION}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:AbortMultipartUpload
        - s3:ListBucket
      Resource:
        - arn:aws:s3:::${env:AWS_STORAGE_BUCKET_NAME}
        - arn:aws:s3:::${env:AWS_STORAGE_BUCKET_NAME}/*

functions:
  app:
    handler: lambda_function.handler
    events:
      - httpApi: '*'

package:
  exclude:
    - .venv/**
    - tests/**
    - '*.pyc'
  include:
    - requirements.txt
    - mysite/**
    - Raj/**
    - templates/**
    - static/**

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    zip: true
    slim: true
    invalidateCaches: true
